<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f8c">
  <title>شفا AI | دستیار هوشمند</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">شفا AI</div>
      <button id="newChat">گفتگوی جدید +</button>
    </header>

    <main id="chat" class="chat">
      <section class="welcome">
        <h1>به شفا AI خوش آمدید</h1>
        <p>دستیار هوشمند شما به زبان دری و انگلیسی</p>
        <p>چگونه می‌توانم کمک‌تان کنم؟</p>
      </section>
    </main>

    <form id="chatForm" class="composer">
      <textarea id="message" placeholder="پیام خود را بنویسید..." rows="2"></textarea>
      <button type="submit">ارسال</button>
    </form>
    <footer>Shifa AI</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
